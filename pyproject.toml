[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soplot"
version = "0.0.1"
authors = [
  { name="Olgun Erguezel", email="olgunerguzel@gmail.com" },
]
description = "Repeatable seaborn.objects plots: layers and modifiers declared as objects, not call arguments"
readme = "README.md"
requires-python = ">=3.11"
## https://peps.python.org/pep-0631/
dependencies = [
   'loguru',
   'numpy',
   'seaborn',
]

classifiers = [
     "Development Status :: 2 - Pre-Alpha",
     "Intended Audience :: Science/Research",
     "Intended Audience :: Information Technology",
     "License :: OSI Approved :: Apache Software License",
     "Operating System :: OS Independent",
     "Programming Language :: Python :: 3.11",
     "Programming Language :: Python :: 3.12",
     "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
## ruff is pinned to the exact version: an unpinned one turns CI red on its own
## one morning. Upgrades arrive as a dependabot PR.
dev = [
   'pytest>=7',
   'ruff==0.16.7',
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["soplot"]

[tool.pytest.ini_options]
## src on the path, so the tests run against the sources without installing
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["examples.*", "tutorials.*","tests.*","models.*"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)


[project.urls]
"Homepage" = "https://github.com/erguzel/soplot"
"Bug Tracker" = "https://github.com/erguzel/soplot/issues"