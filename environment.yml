name: soplot
channels:
  - defaults
dependencies:
  # the floor declared in pyproject.toml: a local env reproduces the CI job
  # most likely to break on a dependency that raised its own floor
  - python=3.11
  - pip
  - pip:
    # pins live in pyproject.toml; conda files are not read by dependabot
    - -e .[dev]
prefix: ./.convenv
