version: 2

updates:
  # The root manifest is pyproject.toml (PEP 621). Only exact pins move here:
  # a dependency with no constraint is already satisfied by every release, so
  # the one entry this watches is ruff, pinned in the dev extra on purpose.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # The example pins its whole stack, which is what a reader installs. This is
  # where a pin that no longer fits the supported pythons shows up.
  - package-ecosystem: pip
    directory: /examples/compare-plot
    schedule:
      interval: weekly
    ignore:
      # numpy 2.5 raised its floor to python 3.12, and the example has to
      # install on 3.11, which is what pyproject.toml declares. Dependabot
      # proposed 2.5.3 anyway. Drop this entry when the floor moves to 3.12.
      - dependency-name: numpy
        versions: ['>=2.5']

  # The workflow's checkout and setup-python actions age too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
